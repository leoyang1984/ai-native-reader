name: Build macOS (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: npm run desktop:build
      - name: Preserve application bundle
        run: ditto -c -k --keepParent 'src-tauri/target/release/bundle/macos/AI Native Reader.app' 'AI-Native-Reader-macOS-unsigned.zip'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AI-Native-Reader-macOS-unsigned
          path: AI-Native-Reader-macOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
